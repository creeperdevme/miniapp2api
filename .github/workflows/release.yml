name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 決定版本號
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 單元測試
        run: go test ./... -count=1

      - name: 建置
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          target=miniapp2api
          if [ "$GOOS" = "windows" ]; then target=miniapp2api.exe; fi
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X miniapp2api/internal/server.Version=$VERSION" \
            -o "dist/$target" .

      - name: 打包
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          cd dist
          base="miniapp2api_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            zip -q "${base}.zip" miniapp2api.exe
            rm -f miniapp2api.exe
          else
            tar -czf "${base}.tar.gz" miniapp2api
            rm -f miniapp2api
          fi
          ls -l

      - name: 上傳 artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniapp2api_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下載所有 artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出打包內容
        run: ls -l dist

      - name: 建立 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
