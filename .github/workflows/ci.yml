name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 檢查格式
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下檔案沒有通過 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 單元測試
        run: go test ./... -count=1

      - name: 建置（Linux）
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/miniapp2api .

      - name: 建置（Windows）
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/miniapp2api.exe .

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 檢查前端語法
        run: |
          node --check internal/server/web/app.js
          node --check internal/server/web/i18n.js
